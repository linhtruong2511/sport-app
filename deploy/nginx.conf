# SportHub Production Nginx Configuration
# Tham khảo: docs/architecture.md (§8 Realtime, §9 Triển khai)
#
# Lưu ý trước khi triển khai:
# 1. Thay `sporthub.example.com` bằng domain thực tế của bạn.
# 2. Thay đường dẫn chứng chỉ SSL (`ssl_certificate`, `ssl_certificate_key`) bằng đường dẫn thực tế.
# 3. Thay khối `allow` trong `/api/v1/webhooks/bank/sepay` bằng dải IP chính thức của SePay và xóa placeholder `127.0.0.1`.
# 4. Kiểm tra cấu hình bằng `sudo nginx -t` trước khi reload.

# Giới hạn tần suất đăng nhập / đăng ký: 10 requests/phút/IP (SDD / architecture.md §9)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Redirect toàn bộ HTTP (80) sang HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name sporthub.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sporthub.example.com;

    # --- TLS / SSL (THAY BẰNG CHỨNG CHỈ THỰC TẾ KHI TRIỂN KHAI) ---
    ssl_certificate     /etc/letsencrypt/live/sporthub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sporthub.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- React SPA Static Files ---
    root /var/www/sporthub/app/dist;
    index index.html;

    client_max_body_size 10m;

    # Cache dài hạn cho tài nguyên build có hash trong /assets/
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Lặp lại security headers vì Nginx không kế thừa add_header khi block con có add_header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # --- Rate-limited Auth Endpoints ---
    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/register {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SePay Webhook (IP Allowlist ở lớp Nginx) ---
    location = /api/v1/webhooks/bank/sepay {
        # SePay Webhook IP Allowlist:
        # Ops PHẢI cập nhật các dòng `allow` bên dưới theo danh sách IP chính thức của SePay
        # trước khi mở production (ví dụ từ tài liệu/cổng quản trị SePay), sau đó xóa 127.0.0.1.
        # allow <SEPAY_WEBHOOK_IP_1>;
        # allow <SEPAY_WEBHOOK_IP_2>;
        allow 127.0.0.1; # Placeholder local test — thay bằng IP/CIDR SePay thực tế
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend REST API ---
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Socket.IO Realtime (WebSocket + Long Polling) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- SPA History Fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
